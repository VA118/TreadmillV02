
name: Build TreadmillVO2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show project targets
        run: |
          xcodebuild -list -project TreadmillVO2.xcodeproj

      - name: Build Apple Watch app
        run: |
          xcodebuild \
            -project TreadmillVO2.xcodeproj \
            -target TreadmillVO2Watch \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project TreadmillVO2.xcodeproj \
            -scheme TreadmillVO2 \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iPhone IPA
        run: |
          xcodebuild \
            -project TreadmillVO2.xcodeproj \
            -scheme TreadmillVO2 \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/vo2-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p Payload
          cp -R "$RUNNER_TEMP/vo2-build/Build/Products/Debug-iphoneos/TreadmillVO2.app" Payload/
          zip -qr TreadmillVO2.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TreadmillVO2-IPA
          path: TreadmillVO2.ipa
