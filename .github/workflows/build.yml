
name: Build TreadmillVO2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show project targets
        run: |
          xcodebuild -list -project TreadmillVO2.xcodeproj

      - name: Build Apple Watch app
        run: |
          xcodebuild \
            -project TreadmillVO2.xcodeproj \
            -target TreadmillVO2Watch \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project TreadmillVO2.xcodeproj \
            -scheme TreadmillVO2 \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
