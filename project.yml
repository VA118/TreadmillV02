name: TreadmillVO2

options:
  bundleIdPrefix: com.treadmillvo2
  deploymentTarget:
    iOS: "17.0"
    watchOS: "9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  TreadmillVO2:
    type: application
    platform: iOS
    sources:
      - iPhone
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treadmillvo2.app
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    

  TreadmillVO2Watch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treadmillvo2.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
